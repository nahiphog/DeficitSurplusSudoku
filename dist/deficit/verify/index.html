<body data-variant="deficit"><nav class="site-nav" aria-label="Main navigation"><a class="site-brand" href="../../">Sudoku Lab</a><div><a class="active" href="../">Deficit Sudoku</a><a href="../../surplus/">Surplus Sudoku</a></div></nav><nav class="sub-nav" aria-label="Deficit Sudoku pages"><a href="../generate/">Generate</a><a href="../simulation/">Simulation</a><a href="../custom-build/">Custom build</a><a class="active" href="./">Verify</a></nav>
<main class="custom-shell"><section class="custom-card"><p class="eyebrow">DEFICIT · VERIFY</p><h1>Verify <em>grid</em></h1><p class="intro">Import a grid and check whether it has exactly one solution under the chosen version’s rules.</p><label class="custom-version">Grid version<select id="verify-version"><option value="deficit">Version 1 · 7 × 7 · digits 1–7</option><option value="deficit2">Version 2 · 6 × 6 · digits 1–7</option><option value="deficit3">Version 3 · 8 × 8 · digits 1–9</option><option value="deficit4">Version 4 · 9 × 9 · digits 0–9</option><option value="deficit5">Version 5 · 4 × 4 · digits 1–5</option></select></label><label class="verify-input">Grid string<textarea id="grid-input" spellcheck="false" autocomplete="off" placeholder="Paste grid string here"></textarea><small>Enter cells left to right, top to bottom. Use a dot (.) for each empty cell. Spaces and line breaks are ignored.</small></label><div class="build-controls"><button id="verify-grid" type="button">Verify</button><button id="cancel-verify" class="secondary-button" type="button" disabled>Cancel</button></div><p id="verify-status" class="status" role="status" aria-live="polite">Paste a grid string and choose Verify.</p><section id="verify-result" class="verify-result" hidden><div class="board-label"><span>IMPORTED GRID</span></div><div id="verify-board" class="board" role="grid" aria-label="Imported puzzle"></div></section></section></main><footer>Deficit Sudoku · Solution verification.</footer><script type="module" src="../../verify.js"></script></body></html>
